// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        minSdkVersion = 24  // Integer.parseInt not required
        compileSdkVersion = 34  // Align with stable version
        targetSdkVersion = 34  // Keep it stable
        kotlinVersion = '1.9.25'
        ndkVersion = "26.1.10909125"
        buildToolsVersion = '34.0.0'
    }
    
    repositories {
        google()
        mavenCentral()
    }
    
    dependencies {
        classpath('com.android.tools.build:gradle:8.1.2')  // Set explicit version
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")  // Use ext variable
        classpath('com.facebook.react:react-native-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }

        maven {
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }
    }
}
